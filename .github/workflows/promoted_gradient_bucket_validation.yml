name: Promoted gradient buffer memory validation

on:
  push:
    branches:
      - validation/promoted-gradient-bucket-memory-20261115

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BASE_SHA: 8945bdcbc364f388e14caebf547dbf302d89e491
      CANDIDATE_SHA: 1be448be05308d24287cccc4d35ba168885d6a23
      PYTHONPATH: .
      OMP_NUM_THREADS: 1
      OPENBLAS_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Create CPU environment
        run: |
          uv venv --python 3.12
          uv pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e '.[test]' tensordict==0.7.2 numpy==1.26.4 onnx==1.18.0 onnxscript==0.5.4
          uv pip freeze
          uv run --no-sync python --version
      - name: Confirm source and test blobs
        run: git diff --exit-code "$CANDIDATE_SHA" HEAD -- rsl_rl tests
      - name: Confirm unchanged source fails the new regressions
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          path = "rsl_rl/utils/utils.py"
          Path(path).write_bytes(subprocess.check_output(["git", "show", f"{os.environ['BASE_SHA']}:{path}"]))
          try:
              subprocess.run(["python", ".github/validation/gradient_bucket_probe.py"], check=True)
              result = subprocess.run([
                  "python", "-m", "pytest", "tests/algorithms/test_distributed.py",
                  "-k", "mixed_dtype_buckets_preserve_memory_bound_and_average",
                  "-q", "--junitxml=/tmp/baseline.xml",
              ])
              suites = list(ET.parse("/tmp/baseline.xml").getroot().iter("testsuite"))
              errors = sum(int(s.get("errors", 0)) for s in suites)
              failures = sum(int(s.get("failures", 0)) for s in suites)
              assert result.returncode == 1 and errors == 0 and failures == 4, (
                  result.returncode, errors, failures
              )
              print(f"BASELINE_CONFIRMED failures={failures} errors={errors}", flush=True)
          finally:
              subprocess.run(["git", "checkout", "--", path], check=True)
          PY
      - name: Verify promoted byte limits and real Gloo averages
        run: |
          uv run --no-sync python .github/validation/gradient_bucket_probe.py
          uv run --no-sync python -m pytest tests/algorithms/test_distributed.py -k 'mixed_dtype_buckets_preserve_memory_bound_and_average' -q
      - name: Run complete CPU suite including Gloo and exports
        run: uv run --no-sync python -m pytest tests/ -q -ra --junitxml=/tmp/full-suite.xml
      - name: Check source diff
        run: git diff --check "$BASE_SHA" "$CANDIDATE_SHA"

  formatting:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 1be448be05308d24287cccc4d35ba168885d6a23
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Run required pre-commit hooks
        run: uvx --from pre-commit==4.2.0 pre-commit run --all-files --show-diff-on-failure
